name: Mise à jour des cours
on:
  schedule:
    - cron: "30 6 * * 1-5"   # chaque jour ouvré à 06:30 UTC
  workflow_dispatch:           # bouton « Run workflow » pour lancer à la main
  push:
    paths: ["assets_v3.json"]  # relance si vous modifiez la liste des actifs
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch_data.py
      - name: Enregistrer les nouveaux cours
        run: |
          git config user.name "cours-bot"
          git config user.email "cours-bot@users.noreply.github.com"
          git add data.js data.json
          git diff --cached --quiet || (git commit -m "Cours du $(date -u +%F)" && git push)
